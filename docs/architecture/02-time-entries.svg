<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 790" width="1100" height="790" role="img" aria-labelledby="t d" xml:space="preserve">
<title id="t">Time entries · log, list, filter by month, edit</title>
<desc id="d">Both the timer and the manual form add to collection('entries'); the Recent entries list is a live query that re-runs on every write.</desc>
<style>
text{white-space:pre}
.big{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#F1F3F8}
.cap{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#9AA3B8}
.h{font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#8C95AB;letter-spacing:.1em}
.t{font:600 13.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#F1F3F8}
.s{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#C9D0DF}
.mu{font:400 11.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#8C95AB}
.m{font:400 11.5px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;fill:#AEBDEB}
.ms{font:400 11px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;fill:#AEBDEB}
.row{font:400 11.5px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;fill:#C9D0DF}
.al{font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#C9D0DF}
.tag{font:700 10px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;letter-spacing:.08em}
.b{font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#FFFFFF}
.march{stroke-dasharray:7 7;animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-14}}
@media (prefers-reduced-motion:reduce){.march{animation:none}}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5574"/></marker>
<marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C95AB"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1099" height="789" rx="18" fill="#12141A" stroke="#2A3040"/>
<text x="36" y="48" class="big">Time entries · log, list, filter by month, edit</text>
<text x="36" y="72" class="cap">Both the timer and the manual form add to collection('entries'); the Recent entries list is a live query that re-runs on every write.</text>

<g><rect x="40" y="104" width="300" height="92" rx="10" fill="#1B2030" stroke="#8399FF" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="62" cy="124" r="11" fill="#3452E1"/><text x="62" y="128" class="b" text-anchor="middle">1</text><text x="326" y="128" class="tag" text-anchor="end" fill="#8399FF">track.js</text><text x="80" y="128" class="t">Timer save (01-timer)</text><text x="54" y="150" class="m">entryFromStoppedTimer(timer, now)</text><text x="54" y="167" class="m">date = localDateStr(startedAt)</text></g>
<g><rect x="40" y="212" width="300" height="214" rx="10" fill="#1B2030" stroke="#8399FF" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="62" cy="232" r="11" fill="#3452E1"/><text x="62" y="236" class="b" text-anchor="middle">2</text><text x="326" y="236" class="tag" text-anchor="end" fill="#8399FF">#manualForm</text><text x="80" y="236" class="t">Log time by hand</text><text x="54" y="258" class="s">client · active clients only</text><text x="54" y="275" class="s">date · defaults to todayStr() (local)</text><text x="54" y="292" class="s">hours · step=&quot;any&quot; min=&quot;0.01&quot;</text><text x="54" y="309" class="s">description · optional, trimmed</text><text x="54" y="334.5" class="m">seconds = Math.round(hours * 3600)</text><text x="54" y="351.5" class="ms" fill="#F2836B">'Add a client first.'</text><text x="54" y="368.5" class="ms" fill="#F2836B">'Enter a valid number of hours.'</text><text x="54" y="385.5" class="ms">→ add({…, invoiced:false, createdAt})</text></g>
<g><rect x="40" y="446" width="300" height="214" rx="10" fill="#1B2030" stroke="#8399FF" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="62" cy="466" r="11" fill="#3452E1"/><text x="62" y="470" class="b" text-anchor="middle">6</text><text x="326" y="470" class="tag" text-anchor="end" fill="#8399FF">dialogs.js</text><text x="80" y="470" class="t">Edit / delete a row</text><text x="54" y="492" class="m">✎ openEditEntry(id)</text><text x="54" y="509" class="mu">   list copy, or a store get() fallback</text><text x="54" y="526" class="s">Save checks hours &gt; 0 and a date</text><text x="54" y="543" class="ms" fill="#F2836B">  ('Enter a valid date.')</text><text x="54" y="560" class="m">doc(id).update({date, seconds,</text><text x="54" y="577" class="m">                description})</text><text x="54" y="594" class="m">→ onEntrySaved(cb): a showing</text><text x="54" y="611" class="ms">   invoice preview reloads (05)</text><text x="54" y="628" class="m">✕ confirmDialog → doc(id).remove()</text></g>
<g><rect x="380" y="104" width="316" height="196" rx="10" fill="#1B2030" stroke="#F2B84B" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="402" cy="124" r="11" fill="#3452E1"/><text x="402" y="128" class="b" text-anchor="middle">3</text><text x="682" y="128" class="tag" text-anchor="end" fill="#F2B84B">STORE</text><text x="420" y="128" class="t">collection('entries')</text><text x="394" y="150" class="m">add(entry)  → stampAdd:</text><text x="394" y="167" class="m">   createdAt kept · updatedAt = now</text><text x="394" y="184" class="m">update(patch) → updatedAt = now</text><text x="394" y="201" class="m">remove()   (soft delete later)</text><text x="394" y="226.5" class="m">every write: IndexedDB put/delete,</text><text x="394" y="243.5" class="m">then notify(listeners) on this path</text></g>
<g><rect x="380" y="324" width="316" height="336" rx="10" fill="#1B2030" stroke="#F2B84B" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="402" cy="344" r="11" fill="#3452E1"/><text x="402" y="348" class="b" text-anchor="middle">4</text><text x="420" y="348" class="t">subscribeEntries() · live query</text><text x="394" y="370" class="s">All months (default, newest 200):</text><text x="394" y="387" class="m">.orderBy('date','desc')</text><text x="394" y="404" class="m">.orderBy('createdAt','desc')</text><text x="394" y="421" class="m">.limit(200)</text><text x="394" y="446.5" class="s">Month picked (#entriesMonth 'YYYY-MM'):</text><text x="394" y="463.5" class="m">range = monthRange(month)</text><text x="394" y="480.5" class="m">.where('date','&gt;=',range.start)</text><text x="394" y="497.5" class="m">.where('date','&lt;=',range.end)</text><text x="394" y="514.5" class="m">.orderBy('date','desc')</text><text x="394" y="531.5" class="m">.orderBy('createdAt','desc')</text><text x="394" y="557" class="mu">Ties fall back to the doc id (desc), so the</text><text x="394" y="574" class="mu">order never depends on IndexedDB key order.</text></g>
<g><rect x="736" y="104" width="324" height="360" rx="10" fill="#1B2030" stroke="#8399FF" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="758" cy="124" r="11" fill="#3452E1"/><text x="758" y="128" class="b" text-anchor="middle">5</text><text x="1046" y="128" class="tag" text-anchor="end" fill="#8399FF">track.js</text><text x="776" y="128" class="t">Recent entries</text></g>
<rect x="752" y="140" width="112" height="26" rx="6" fill="#0E1016" stroke="#3A4360"/><text x="762" y="158" class="row">2026-10 ▾</text>
<rect x="872" y="140" width="86" height="26" rx="6" fill="#222842" stroke="#3A4360"/><text x="915" y="158" class="al" text-anchor="middle">All months</text>
<text x="752" y="188" class="s" fill="#3DD6A8">October 2026 · 7.75h</text>
<line x1="752" y1="200" x2="1044" y2="200" stroke="#2E3548"/>
<text x="752" y="222" class="row">Oct 9</text><text x="806" y="222" class="row">Design review</text><text x="996" y="222" class="row" text-anchor="end">2.00h</text><text x="1012" y="222" class="mu">✎ ✕</text>
<text x="752" y="248" class="row">Oct 9</text><text x="806" y="248" class="row">Client call</text><text x="996" y="248" class="row" text-anchor="end">0.50h</text><text x="1012" y="248" class="mu">✎ ✕</text>
<text x="752" y="274" class="row">Oct 8</text><text x="806" y="274" class="row">Wireframes</text><rect x="890" y="262" width="54" height="16" rx="8" fill="#163A30"/><text x="917" y="274" class="tag" text-anchor="middle" fill="#3DD6A8">INVOICED</text><text x="996" y="274" class="row" text-anchor="end">3.00h</text><text x="1012" y="274" class="mu">✎ ✕</text>
<text x="752" y="300" class="row">Oct 2</text><text x="806" y="300" class="row" fill="#8C95AB">No description</text><text x="996" y="300" class="row" text-anchor="end">2.25h</text><text x="1012" y="300" class="mu">✎ ✕</text>
<line x1="752" y1="320" x2="1044" y2="320" stroke="#2E3548"/>
<text x="752" y="342" class="mu">Same day: newer createdAt first (Oct 9 rows).</text>
<text x="752" y="362" class="mu">Summary = sum of hoursFromSeconds(e.seconds).</text>
<text x="752" y="388" class="mu">Empty month → "No time logged in October 2026."</text>
<text x="752" y="408" class="mu">All months → clears the filter and the summary.</text>
<text x="752" y="436" class="mu">"No description" · hours shown with an "h" suffix.</text>
<g><rect x="736" y="482" width="324" height="178" rx="10" fill="#1B2030" stroke="#B892FF" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="752" cy="502" r="4" fill="#B892FF"/><text x="1046" y="506" class="tag" text-anchor="end" fill="#B892FF">track.js</text><text x="764" y="506" class="t">A view filter only</text><text x="750" y="528" class="s">Lives in ui/track.js (not in state.js);</text><text x="750" y="545" class="s">resets on reload, nothing is saved.</text><text x="750" y="562" class="s">Survives add / edit / delete and timer saves:</text><text x="750" y="579" class="s">the subscription re-queries with it.</text><text x="750" y="596" class="s">Does not touch the invoice preview, the</text><text x="750" y="613" class="s">timer or any stored data.</text></g>
<text x="40" y="740" class="mu">Flow: 1 timer save · 2 manual add → 3 store → 4 live query → 5 list → 6 edit or delete → 3 → 4 re-runs → 5 list updates.</text>
<text x="40" y="760" class="mu">Hours: entries store whole seconds; lists and invoices show hoursFromSeconds() = seconds / 3600 rounded to 2 decimals.</text>
