<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 830" width="1100" height="830" role="img" aria-labelledby="t d" xml:space="preserve">
<title id="t">Settings and sales tax</title>
<desc id="d">Settings are one document; tax lines come from a Canadian table or up to two custom lines, and are frozen into each invoice.</desc>
<style>
text{white-space:pre}
.big{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#F1F3F8}
.cap{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#9AA3B8}
.h{font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#8C95AB;letter-spacing:.1em}
.t{font:600 13.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#F1F3F8}
.s{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#C9D0DF}
.mu{font:400 11.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#8C95AB}
.m{font:400 11.5px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;fill:#AEBDEB}
.ms{font:400 11px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;fill:#AEBDEB}
.row{font:400 11.5px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;fill:#C9D0DF}
.al{font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#C9D0DF}
.tag{font:700 10px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;letter-spacing:.08em}
.b{font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#FFFFFF}
.march{stroke-dasharray:7 7;animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-14}}
@media (prefers-reduced-motion:reduce){.march{animation:none}}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5574"/></marker>
<marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C95AB"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1099" height="829" rx="18" fill="#12141A" stroke="#2A3040"/>
<text x="36" y="48" class="big">Settings and sales tax</text>
<text x="36" y="72" class="cap">Settings are one document; tax lines come from a Canadian table or up to two custom lines, and are frozen into each invoice.</text>

<g><rect x="40" y="104" width="320" height="370" rx="10" fill="#1B2030" stroke="#8399FF" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="62" cy="124" r="11" fill="#3452E1"/><text x="62" y="128" class="b" text-anchor="middle">1</text><rect x="38" y="102" width="324" height="374" rx="12" fill="none" stroke="#8399FF" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0;0.004;0.14;0.152;1" dur="10s" repeatCount="indefinite"/></rect><text x="346" y="128" class="tag" text-anchor="end" fill="#8399FF">ui/settings.js</text><text x="80" y="128" class="t">Settings screen</text><text x="54" y="150" class="s" fill="#F1F3F8">Billing</text><text x="54" y="167" class="m">#setRate · #setCurrency · #setNextInv</text><text x="54" y="184" class="s" fill="#F1F3F8">Sales tax</text><text x="54" y="201" class="m">#taxCountry: none · Canada ·</text><text x="54" y="218" class="m">  United States · Other / custom</text><text x="54" y="235" class="m">Canada → #taxProvince</text><text x="54" y="252" class="s">US / Other → up to two label + % pairs</text><text x="54" y="269" class="m">  #taxLabel1 / #taxRate1, …2</text><text x="54" y="286" class="m">live: updateTaxPreviewUI()</text><text x="54" y="303" class="mu">&quot;Applied to invoices: GST 5% + QST 9.975%&quot;</text><text x="54" y="320" class="s" fill="#F1F3F8">Your business details</text><text x="54" y="337" class="s">name · email · address · invoice notes</text><text x="54" y="362.5" class="s" fill="#F1F3F8">Save Settings → one write</text></g>
<g><rect x="400" y="104" width="300" height="156" rx="10" fill="#1B2030" stroke="#F2B84B" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="422" cy="124" r="11" fill="#3452E1"/><text x="422" y="128" class="b" text-anchor="middle">2</text><rect x="398" y="102" width="304" height="160" rx="12" fill="none" stroke="#8399FF" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1337;0.1457;0.2829;0.2949;1" dur="10s" repeatCount="indefinite"/></rect><text x="686" y="128" class="tag" text-anchor="end" fill="#F2B84B">STORE</text><text x="440" y="128" class="t">doc('settings/main')</text><text x="414" y="150" class="m">.set(data): full replace</text><text x="414" y="167" class="m">  → stampWrite adds updatedAt</text><text x="414" y="184" class="m">rate: parseFloat(…) || 0</text><text x="414" y="201" class="m">currency: trimmed || &quot;$&quot;</text><text x="414" y="218" class="m">custom %: 8.25 → 0.0825 (÷ 100)</text></g>
<g><rect x="400" y="290" width="300" height="184" rx="10" fill="#1B2030" stroke="#B892FF" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="422" cy="310" r="11" fill="#3452E1"/><text x="422" y="314" class="b" text-anchor="middle">3</text><rect x="398" y="288" width="304" height="188" rx="12" fill="none" stroke="#8399FF" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2766;0.2886;0.4257;0.4377;1" dur="10s" repeatCount="indefinite"/></rect><text x="686" y="314" class="tag" text-anchor="end" fill="#B892FF">STATE</text><text x="440" y="314" class="t">settings.subscribe(cb)</text><text x="414" y="336" class="m">onSnapshot → state.settings =</text><text x="414" y="353" class="m">  {...defaultSettings(), ...data}</text><text x="414" y="370" class="m">renderSettings(): fields + banner</text><text x="414" y="387" class="mu">setup banner hides once rate and</text><text x="414" y="404" class="mu">business name are set</text><text x="414" y="421" class="m">cb (main.js): if state.invPreviewRows</text><text x="414" y="438" class="m">  → renderInvoicePreview()</text></g>
<g><rect x="740" y="104" width="320" height="370" rx="10" fill="#1B2030" stroke="#3DD6A8" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="762" cy="124" r="11" fill="#3452E1"/><text x="762" y="128" class="b" text-anchor="middle">6</text><rect x="738" y="102" width="324" height="374" rx="12" fill="none" stroke="#8399FF" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5623;0.5743;0.7114;0.7234;1" dur="10s" repeatCount="indefinite"/></rect><text x="780" y="128" class="t">getEffectiveTaxLines(settings)</text><text x="754" y="150" class="m">'Canada' → TAX_TABLES[taxRegion] || []</text><text x="754" y="167" class="m">'United States' | 'Other / custom' →</text><text x="754" y="184" class="m">  custom lines with label &amp;&amp; rate &gt; 0</text><text x="754" y="201" class="m">anything else ('') → [] (no tax)</text><text x="754" y="226.5" class="s">TAX_TABLES in domain/tax.js (13 regions)</text><text x="754" y="243.5" class="m">Ontario                   HST 13%</text><text x="754" y="260.5" class="m">Nova Scotia               HST 14%</text><text x="754" y="277.5" class="m">NB · NL · PEI             HST 15%</text><text x="754" y="294.5" class="m">Quebec       GST 5% + QST 9.975%</text><text x="754" y="311.5" class="m">British Columbia GST 5% + PST 7%</text><text x="754" y="328.5" class="m">Manitoba       GST 5% + RST 7%</text><text x="754" y="345.5" class="m">Saskatchewan   GST 5% + PST 6%</text><text x="754" y="362.5" class="m">Alberta · YT · NT · NU     GST 5%</text><text x="754" y="379.5" class="mu">Rates last checked September 2026.</text></g>
<g><rect x="40" y="510" width="320" height="150" rx="10" fill="#1B2030" stroke="#8399FF" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="62" cy="530" r="11" fill="#3452E1"/><text x="62" y="534" class="b" text-anchor="middle">4</text><rect x="38" y="508" width="324" height="154" rx="12" fill="none" stroke="#8399FF" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4194;0.4314;0.5686;0.5806;1" dur="10s" repeatCount="indefinite"/></rect><text x="346" y="534" class="tag" text-anchor="end" fill="#8399FF">IF SHOWING</text><text x="80" y="534" class="t">Invoice preview (05)</text><text x="54" y="556" class="s">re-rendered, not reloaded: same rows,</text><text x="54" y="573" class="s">new rate, currency and tax lines</text><text x="54" y="590" class="m">taxJurisdictionLabel(settings)</text><text x="54" y="607" class="mu">&quot;Tax jurisdiction: Ontario, Canada&quot;</text><text x="54" y="624" class="mu">labels: formatRatePct(0.09975) → 9.975</text></g>
<g><rect x="400" y="510" width="300" height="150" rx="10" fill="#1B2030" stroke="#3DD6A8" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="422" cy="530" r="11" fill="#3452E1"/><text x="422" y="534" class="b" text-anchor="middle">5</text><rect x="398" y="508" width="304" height="154" rx="12" fill="none" stroke="#8399FF" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7051;0.7171;0.8543;0.8663;1" dur="10s" repeatCount="indefinite"/></rect><text x="686" y="534" class="tag" text-anchor="end" fill="#3DD6A8">PURE</text><text x="440" y="534" class="t">computeInvoiceTotals</text><text x="414" y="556" class="m">(rows, settings)</text><text x="414" y="573" class="m">subtotal = Σ round(h × rate, 2)</text><text x="414" y="590" class="m">           + expense amounts</text><text x="414" y="607" class="m">each tax = round(subtotal × rate, 2)</text><text x="414" y="624" class="m">grandTotal = subtotal + taxTotal</text></g>
<g><rect x="40" y="690" width="1020" height="116" rx="10" fill="#1B2030" stroke="#38BDE6" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="62" cy="710" r="11" fill="#3452E1"/><text x="62" y="714" class="b" text-anchor="middle">7</text><rect x="38" y="688" width="1024" height="120" rx="12" fill="none" stroke="#8399FF" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.848;0.86;0.996;1;1" dur="10s" repeatCount="indefinite"/></rect><text x="1046" y="714" class="tag" text-anchor="end" fill="#38BDE6">SNAPSHOT</text><text x="80" y="714" class="t">Frozen at Generate · buildInvoiceDoc → invoices/{id}</text><text x="54" y="736" class="m">number · currency · rate · from {name, email, address} · notes · taxLines [{label, rate, amount}] · taxTotal · grandTotal</text><text x="54" y="753" class="s">Saved invoices never change when settings change later: history rows and Re-download use the stored currency, lines and totals.</text><text x="54" y="770" class="s">Only the counter moves on: recordInvoice → settings/main.update({ nextInvoiceNumber: n + 1 }) (an update, so other settings stay).</text></g>
