<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 660" width="1100" height="660" role="img" aria-labelledby="t d" xml:space="preserve">
<title id="t">Clients · add, edit, archive, delete</title>
<desc id="d">One clients snapshot feeds the client list and all four client dropdowns, so every screen updates together.</desc>
<style>
text{white-space:pre}
.big{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#F1F3F8}
.cap{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#9AA3B8}
.h{font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#8C95AB;letter-spacing:.1em}
.t{font:600 13.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#F1F3F8}
.s{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#C9D0DF}
.mu{font:400 11.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#8C95AB}
.m{font:400 11.5px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;fill:#AEBDEB}
.ms{font:400 11px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;fill:#AEBDEB}
.row{font:400 11.5px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;fill:#C9D0DF}
.al{font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#C9D0DF}
.tag{font:700 10px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;letter-spacing:.08em}
.b{font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#FFFFFF}
.march{stroke-dasharray:7 7;animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-14}}
@media (prefers-reduced-motion:reduce){.march{animation:none}}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5574"/></marker>
<marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C95AB"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1099" height="659" rx="18" fill="#12141A" stroke="#2A3040"/>
<text x="36" y="48" class="big">Clients · add, edit, archive, delete</text>
<text x="36" y="72" class="cap">One clients snapshot feeds the client list and all four client dropdowns, so every screen updates together.</text>

<g><rect x="40" y="104" width="316" height="222" rx="10" fill="#1B2030" stroke="#8399FF" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="62" cy="124" r="11" fill="#3452E1"/><text x="62" y="128" class="b" text-anchor="middle">1</text><text x="342" y="128" class="tag" text-anchor="end" fill="#8399FF">#clientForm</text><text x="80" y="128" class="t">Add / edit a client</text><text x="54" y="150" class="s">name (trimmed, required) · email · address</text><text x="54" y="167" class="ms" fill="#F2836B">'Enter a client name.'</text><text x="54" y="192.5" class="s" fill="#F1F3F8">Add:</text><text x="54" y="209.5" class="m">add({ name, email, address,</text><text x="54" y="226.5" class="m">      archived:false, createdAt })</text><text x="54" y="243.5" class="s" fill="#F1F3F8">Edit (startEditClient fills the form):</text><text x="54" y="260.5" class="m">doc(id).update({ name, email, address })</text><text x="54" y="277.5" class="mu">archived is not sent, so an archived</text><text x="54" y="294.5" class="mu">client stays archived (A1)</text></g>
<g><rect x="40" y="346" width="316" height="190" rx="10" fill="#1B2030" stroke="#8399FF" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="62" cy="366" r="11" fill="#3452E1"/><text x="62" y="370" class="b" text-anchor="middle">4</text><text x="342" y="370" class="tag" text-anchor="end" fill="#8399FF">clients.js</text><text x="80" y="370" class="t">Row actions</text><text x="54" y="392" class="s">Edit → loads the row into the form</text><text x="54" y="409" class="s">Archive / Unarchive →</text><text x="54" y="426" class="m">doc(id).update({ archived: !archived })</text><text x="54" y="443" class="s">✕ Delete permanently → confirmDialog →</text><text x="54" y="460" class="m">doc(id).remove()</text><text x="54" y="477" class="mu">Past entries and invoices keep their own</text><text x="54" y="494" class="mu">copy of clientName.</text></g>
<g><rect x="396" y="104" width="300" height="150" rx="10" fill="#1B2030" stroke="#F2B84B" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="418" cy="124" r="11" fill="#3452E1"/><text x="418" y="128" class="b" text-anchor="middle">2</text><text x="682" y="128" class="tag" text-anchor="end" fill="#F2B84B">STORE</text><text x="436" y="128" class="t">collection('clients')</text><text x="410" y="150" class="m">add → stampAdd (createdAt, updatedAt)</text><text x="410" y="167" class="m">update → updatedAt = now</text><text x="410" y="184" class="m">remove → IndexedDB delete</text><text x="410" y="201" class="mu">each write notifies the listeners</text></g>
<g><rect x="396" y="282" width="300" height="254" rx="10" fill="#1B2030" stroke="#B892FF" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="418" cy="302" r="11" fill="#3452E1"/><text x="418" y="306" class="b" text-anchor="middle">3</text><text x="436" y="306" class="t">clients.subscribe(onClientsChanged)</text><text x="410" y="328" class="m">.orderBy('name').onSnapshot(…)</text><text x="410" y="345" class="s">then a case-insensitive sort:</text><text x="410" y="362" class="m">a.name.localeCompare(b.name,</text><text x="410" y="379" class="m">  undefined, {sensitivity:'base'})</text><text x="410" y="396" class="m">  || id order</text><text x="410" y="413" class="m">→ state.clients</text><text x="410" y="430" class="m">→ renderClients()</text><text x="410" y="447" class="m">→ renderClientDropdowns()</text><text x="410" y="464" class="m">→ onClientsChanged() (ui/invoices)</text><text x="410" y="481" class="mu">   previewed client deleted →</text><text x="410" y="498" class="ms">   clearInvoicePreview()</text></g>
<g><rect x="736" y="104" width="324" height="164" rx="10" fill="#1B2030" stroke="#8399FF" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="752" cy="124" r="4" fill="#8399FF"/><text x="764" y="128" class="t">Your clients · renderClients()</text></g>
<text x="752" y="152" class="s">Acme Robotics</text><text x="1044" y="152" class="mu" text-anchor="end">Edit · Archive · ✕</text>
<text x="752" y="178" class="s">beta Works</text><text x="1044" y="178" class="mu" text-anchor="end">Edit · Archive · ✕</text>
<text x="752" y="204" class="s">Northwind Studio</text><text x="1044" y="204" class="mu" text-anchor="end">Edit · Archive · ✕</text>
<text x="752" y="230" class="s" fill="#8C95AB">zephyr Labs</text><rect x="840" y="218" width="66" height="16" rx="8" fill="#262B38"/><text x="873" y="230" class="tag" text-anchor="middle" fill="#8C95AB">ARCHIVED</text><text x="1044" y="230" class="mu" text-anchor="end">Edit · Unarchive · ✕</text>
<text x="752" y="258" class="mu">"beta" sorts between A and N (sensitivity 'base').</text>
<g><rect x="736" y="290" width="324" height="50" rx="10" fill="#1B2030" stroke="#8399FF" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="752" cy="310" r="4" fill="#8399FF"/><text x="1046" y="314" class="tag" text-anchor="end" fill="#8399FF">ACTIVE ONLY</text><text x="764" y="314" class="t">Track · timer</text><text x="750" y="332" class="ms">&lt;select #timerClient&gt; · fillClientSelect</text></g>
<g><rect x="736" y="352" width="324" height="50" rx="10" fill="#1B2030" stroke="#8399FF" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="752" cy="372" r="4" fill="#8399FF"/><text x="1046" y="376" class="tag" text-anchor="end" fill="#8399FF">ACTIVE ONLY</text><text x="764" y="376" class="t">Track · log time by hand</text><text x="750" y="394" class="ms">&lt;select #manClient&gt; · fillClientSelect</text></g>
<g><rect x="736" y="414" width="324" height="50" rx="10" fill="#1B2030" stroke="#8399FF" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="752" cy="434" r="4" fill="#8399FF"/><text x="1046" y="438" class="tag" text-anchor="end" fill="#8399FF">ACTIVE ONLY</text><text x="764" y="438" class="t">Track · log an expense</text><text x="750" y="456" class="ms">&lt;select #expClient&gt; · fillClientSelect</text></g>
<g><rect x="736" y="476" width="324" height="50" rx="10" fill="#1B2030" stroke="#38BDE6" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="752" cy="496" r="4" fill="#38BDE6"/><text x="1046" y="500" class="tag" text-anchor="end" fill="#38BDE6">incl. &quot;(archived)&quot;</text><text x="764" y="500" class="t">Invoices · client picker</text><text x="750" y="518" class="ms">&lt;select #invClient&gt; · fillClientSelect</text></g>
<text x="736" y="556" class="mu">fillClientSelect keeps the current choice when it is still listed.</text>
<text x="40" y="590" class="mu">Deleting a client is permanent today (doc.remove(), soft delete later). Entries, expenses and invoices are not deleted with it;</text>
<text x="40" y="608" class="mu">they carry clientId plus a clientName copy, so history and re-downloads still read correctly. Renaming does not rewrite old records.</text>
<text x="40" y="632" class="mu">Flow: 1 form → 2 store → 3 snapshot + sort → list and dropdowns · 4 row action → 2 → 3 → refreshed everywhere.</text>
