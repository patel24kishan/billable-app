<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 810" width="1100" height="810" role="img" aria-labelledby="t d" xml:space="preserve">
<title id="t">Expenses and receipts</title>
<desc id="d">A receipt is shrunk in the browser, stored as a data URL on the expense, and only read or written through lib/receipts.js.</desc>
<style>
text{white-space:pre}
.big{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#F1F3F8}
.cap{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#9AA3B8}
.h{font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#8C95AB;letter-spacing:.1em}
.t{font:600 13.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#F1F3F8}
.s{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#C9D0DF}
.mu{font:400 11.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#8C95AB}
.m{font:400 11.5px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;fill:#AEBDEB}
.ms{font:400 11px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;fill:#AEBDEB}
.row{font:400 11.5px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;fill:#C9D0DF}
.al{font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#C9D0DF}
.tag{font:700 10px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;letter-spacing:.08em}
.b{font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#FFFFFF}
.march{stroke-dasharray:7 7;animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-14}}
@media (prefers-reduced-motion:reduce){.march{animation:none}}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5574"/></marker>
<marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C95AB"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1099" height="809" rx="18" fill="#12141A" stroke="#2A3040"/>
<text x="36" y="48" class="big">Expenses and receipts</text>
<text x="36" y="72" class="cap">A receipt is shrunk in the browser, stored as a data URL on the expense, and only read or written through lib/receipts.js.</text>

<g><rect x="40" y="110" width="300" height="236" rx="10" fill="#1B2030" stroke="#8399FF" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="62" cy="130" r="11" fill="#3452E1"/><text x="62" y="134" class="b" text-anchor="middle">1</text><text x="326" y="134" class="tag" text-anchor="end" fill="#8399FF">#expenseForm</text><text x="80" y="134" class="t">Log an expense</text><text x="54" y="156" class="s">client · date (todayStr()) · title · amount</text><text x="54" y="173" class="s">receipt file: optional, accept JPEG / PNG</text><text x="54" y="198.5" class="m">title trimmed, amount &gt; 0, else</text><text x="54" y="215.5" class="ms" fill="#F2836B">'Enter a title and a valid amount.'</text><text x="54" y="232.5" class="m">amount = Math.round(a * 100) / 100</text><text x="54" y="249.5" class="m">exp = { clientId, clientName, date,</text><text x="54" y="266.5" class="m">  title, amount, invoiced:false,</text><text x="54" y="283.5" class="m">  createdAt }</text><text x="54" y="300.5" class="mu">button shows &quot;Attaching receipt…&quot;</text></g>
<g><rect x="380" y="110" width="316" height="236" rx="10" fill="#1B2030" stroke="#F2B84B" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="402" cy="130" r="11" fill="#3452E1"/><text x="402" y="134" class="b" text-anchor="middle">2</text><text x="420" y="134" class="t">fileToCompressedDataUrl(file)</text><text x="394" y="156" class="s">image/jpeg or image/png only, else</text><text x="394" y="173" class="ms" fill="#F2836B">'Please choose a JPEG or PNG image.'</text><text x="394" y="190" class="m">FileReader → Image → &lt;canvas&gt;</text><text x="394" y="207" class="m">longest side ≤ 1400 px (never upscaled)</text><text x="394" y="224" class="m">JPEG → toDataURL(jpeg, 0.78)</text><text x="394" y="241" class="m">PNG  → stays PNG</text><text x="394" y="258" class="m">→ { dataUrl, type, width, height }</text><text x="394" y="283.5" class="m">receiptFields(receipt) →</text><text x="394" y="300.5" class="m">  receiptData · receiptType ·</text><text x="394" y="317.5" class="m">  receiptW · receiptH</text></g>
<g><rect x="736" y="110" width="324" height="236" rx="10" fill="#1B2030" stroke="#F2B84B" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="758" cy="130" r="11" fill="#3452E1"/><text x="758" y="134" class="b" text-anchor="middle">3</text><text x="1046" y="134" class="tag" text-anchor="end" fill="#F2B84B">STORE</text><text x="776" y="134" class="t">collection('expenses')</text><text x="750" y="156" class="m">add(exp + receipt fields)</text><text x="750" y="173" class="m">  → stampAdd: createdAt · updatedAt</text><text x="750" y="190" class="m">doc(id).update(patch)</text><text x="750" y="207" class="m">  → updatedAt = now</text><text x="750" y="224" class="m">doc(id).remove()</text><text x="750" y="249.5" class="s">Receipt bytes live inside the expense</text><text x="750" y="266.5" class="s">record (a data URL) in IndexedDB</text><text x="750" y="283.5" class="s">&quot;documents&quot;; nothing leaves the device.</text></g>
<g><rect x="40" y="380" width="300" height="150" rx="10" fill="#1B2030" stroke="#F2B84B" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="56" cy="400" r="4" fill="#F2B84B"/><text x="326" y="404" class="tag" text-anchor="end" fill="#F2B84B">blob API</text><text x="68" y="404" class="t">lib/receipts.js · the seam</text><text x="54" y="426" class="m">hasReceipt(x) · getReceipt(x)</text><text x="54" y="443" class="m">receiptFields(r)</text><text x="54" y="460" class="m">clearedReceiptFields() → all null</text><text x="54" y="477" class="m">createReceipts(store).put / remove</text><text x="54" y="494" class="mu">the only code that knows the field</text><text x="54" y="511" class="mu">names, so cloud storage can slot in</text></g>
<g><rect x="380" y="380" width="262" height="150" rx="10" fill="#1B2030" stroke="#8399FF" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="402" cy="400" r="11" fill="#3452E1"/><text x="402" y="404" class="b" text-anchor="middle">5</text><text x="628" y="404" class="tag" text-anchor="end" fill="#8399FF">dialogs.js</text><text x="420" y="404" class="t">View receipt</text><text x="394" y="426" class="m">📎 openReceiptView(x)</text><text x="394" y="443" class="ms">#receiptViewImg.src =</text><text x="394" y="460" class="ms">  getReceipt(x).dataUrl</text><text x="394" y="477" class="s">title &quot;Receipt — &lt;title&gt;&quot;</text><text x="394" y="494" class="mu">Close clears the image</text></g>
<g><rect x="736" y="380" width="324" height="236" rx="10" fill="#1B2030" stroke="#8399FF" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="758" cy="400" r="11" fill="#3452E1"/><text x="758" y="404" class="b" text-anchor="middle">4</text><text x="1046" y="404" class="tag" text-anchor="end" fill="#8399FF">track.js</text><text x="776" y="404" class="t">Recent expenses</text><text x="750" y="426" class="m">orderBy('date','desc')</text><text x="750" y="443" class="m">.orderBy('createdAt','desc').limit(200)</text></g>
<text x="752" y="470" class="row">Oct 9</text><text x="804" y="470" class="row">Font license</text><text x="968" y="470" class="row" text-anchor="end">$47.50</text><text x="980" y="470" class="mu">📎 ✎ ✕</text>
<text x="752" y="496" class="row">Oct 6</text><text x="804" y="496" class="row">Train ticket</text><text x="968" y="496" class="row" text-anchor="end">$32.00</text><text x="980" y="496" class="mu">📎 ✎ ✕</text>
<text x="752" y="522" class="row">Oct 2</text><text x="804" y="522" class="row">Stock photos</text><text x="968" y="522" class="row" text-anchor="end">$19.00</text><text x="980" y="522" class="mu">   ✎ ✕</text>
<line x1="752" y1="448" x2="1044" y2="448" stroke="#2E3548"/>
<text x="752" y="566" class="mu">📎 only when hasReceipt(x) · ✕ confirmDialog</text><text x="752" y="584" class="mu">→ doc(id).remove()</text><text x="752" y="602" class="mu">Amounts: money(amount, settings.currency)</text>
<g><rect x="40" y="560" width="656" height="226" rx="10" fill="#1B2030" stroke="#8399FF" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="62" cy="580" r="11" fill="#3452E1"/><text x="62" y="584" class="b" text-anchor="middle">6</text><text x="682" y="584" class="tag" text-anchor="end" fill="#8399FF">dialogs.js</text><text x="80" y="584" class="t">Edit expense dialog · openEditExpense(id)</text><text x="54" y="606" class="s">date · amount · title</text><text x="54" y="623" class="s">  validated like the form, plus</text><text x="54" y="640" class="ms" fill="#F2836B">  'Enter a valid date.' (empty date)</text><text x="54" y="665.5" class="s">Has a receipt: thumbnail +</text><text x="54" y="682.5" class="s">  &quot;Remove receipt&quot;</text><text x="54" y="699.5" class="s">No receipt: picking a file shows</text><text x="54" y="716.5" class="s">  &quot;Clear selected file&quot; (undo the pick)</text><text x="54" y="733.5" class="s">Both also empty the file input</text><text x="54" y="750.5" class="mu">(Remove after a pick never saves that file)</text></g>
<line x1="360" y1="600" x2="360" y2="770" stroke="#2E3548"/>
<text x="376" y="606" class="s" fill="#F1F3F8">Save Changes builds the patch:</text>
<text x="376" y="628" class="m">new file  → fileToCompressedDataUrl</text>
<text x="376" y="645" class="m">            → receiptFields(receipt)</text>
<text x="376" y="666" class="m">removed   → clearedReceiptFields()</text>
<text x="376" y="687" class="m">otherwise → receipt untouched</text>
<text x="376" y="712" class="m">doc(id).update({date, amount, title, …})</text>
<text x="376" y="733" class="m">→ onExpenseSaved(cb): a showing invoice</text>
<text x="376" y="750" class="m">  preview reloads, ticks kept by id (05)</text>
